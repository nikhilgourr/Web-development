<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- 2nd method to add css, INTERNAL CSS -->
    <style>
        h1 {
            color: blue;
            background-color:black;
        }
    </style>

</head>
<body>
    
    <!-- 1st method to add css -->
    <!-- INLINE CSS OR STYLE -->
    <!-- Color property in css -->
    <h1 style="color: rgb(139, 114, 114);">Everything</h1>
    <p style="color: rgb(172, 19, 44);"> Hello, how are you </p>
    <button style="color: rgb(20, 2, 2); background-color:rgb(255, 255, 255)">Feedback</button>
    

    <!-- 2nd method to add css -->
    <!-- USING STYLE TAG INSIDE HEAD, INTERNAL CSS -->
    <!-- For selecting multiple elements without writing the code again & again -->
    <h1>HEllo</h1>
    <h1>how are you </h1>
    <h1>i hope you are doing well</h1>
    
</body>
</html>
