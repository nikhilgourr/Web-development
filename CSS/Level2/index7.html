    <h1>Display Property Drawback if we convert block into inline , we can not set margin and padding for top and bottum so for solving this we use <u>inline-block property</u></h1>

    <div style="background-color: red;">Box 1</div>
    <div style="background-color: rgba(0,255,0,0.5);">Box 2</div>

    <!-- visibility property -->
    <h1>Box 3 is hidden but space is occupied for box 3 check it from inspect </h1>
    <div style="background-color: rgba(0,0,255,0.5);" id="hidden">Box 3</div>
    <div style="background-color: blueviolet;">Box 4</div>
