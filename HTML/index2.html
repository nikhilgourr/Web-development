<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Used to display text as it is -->
    <!-- Without ignoring spaces and next line -->
    <!-- It will properly print text in a next line and give spaces -->
    <pre> 
        This is 
        sample text
    </pre>

    <pre>
        Lorem ipsum dolor sit
        amet consectetur adipisicing elit. 
        Ducimus, minima?
    </pre>

    <!-- If we use <p> tag it will print the text in 1 single line -->
    <!-- That's why in such cases we should use <pre> tag -->
    <p>
        Lorem ipsum dolor sit
        amet consectetur adipisicing elit. 
        Ducimus, minima?
    </p>

</body>
</html>
