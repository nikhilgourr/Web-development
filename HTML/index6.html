<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- It is used to contain multiple elements -->
    <!-- It is a Block element -->
    <!-- Takes full width space -->
    <div> 
        <h1> It is a div which is containing multiple elements</h1>
        <p>hello</p>
        <p>hi</p>
        <p>bye</p>
    </div>

    <!-- It is also used to contain multiple elements -->
    <!-- It is an Inline Element -->
    <!-- Takes width as per size -->
    <!-- Jitna chaiye utna hi size lega -->
    <span> 
        Namasthe
    </span>

</body>
</html>
