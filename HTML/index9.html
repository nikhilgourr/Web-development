<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Table -->

    <!-- tr is for row -->
    
    <!-- th is header -->

    <!-- td is for data -->

    <!-- thead for header part-->

    <!-- tbody for data and body -->

    <!-- Caption is for naming of the table -->

    <!-- colspan attribute for making 1 header for 2 or more columns -->

    <table>
        <!--This thead tag is for table's header part -->
        <thead>
            <!-- This caption is used for giving a name to the tabel -->
            <!-- It tells what kind of data is conatained by the table -->
            <caption>Student data </caption>

             <!-- This block is for header -->
            <tr>
                <th>Name</th>
                <th>Roll no</th>
            </tr>
        </thead>

        <!-- This tbody tag is for table's data part -->
        <tbody>
            <!-- This block is for data -->
            <tr>
                <td>John</td>
                <td>18</td>
            </tr>

            <tr>
                <td>merry</td>
                <td>19</td>
            </tr>

            <tr>
                <td>niama</td>
                <td>20</td>
            </tr>
        </tbody>

    </table>


    <!-- 2nd table -->
    <table>
        <tr>
            <!-- colspan ek hi header ko sbh coloumns or row ke liye expand kar deta hai -->
            <th colspan="4">
                INFORMATION
            </th>
        </tr>

        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>

        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
        </tr>

    </table>

</body>
</html>
