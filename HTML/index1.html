<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first page</title>
</head>

<body>
    <p> Lorem ipsum dolor sit amet.</p>

    <br> <!-- Line breaking -->

    <h1>Heading 1</h1> <!-- Used to display Headings
    (Important text or heading for Better SEO) -->
    <!-- Do not use heading for text Size -->
    <h6>Heading 6</h6>

    <!-- Used to add links to a page -->
    <a href="https://google.com">
        Google
    </a>

    <br/>

    <a href="/Hello.html"> <!-- Hello.html is diffrent file for HELLO printing -->
        Click here
    </a>

    <br/>

    <!-- This is Absolute link of image (Direct from internet)-->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLLwZNAQTBMsdGSMzjlmh04j9ihuFqR9LNkzrn0qgObA&s=10" alt="Notebook "height='100'>

    <br/> 

    <!-- This is Relative link of image because this link is in a folder -->
    <img src="/ImageFolder/image.png" alt="Notebook"height='100'>

    <br/>
    <!-- For Bold text -->
    <b>Bold</b>

    <br/>
    <!-- For Italic text -->
    <i>Italic</i>

    <br/>
    <!-- For Underline -->
    <u>Underlined</u>

    <br/>
    <!-- We can write Multiple tags under tag -->
    <p>
        <b>
            <i>
                <u>Lorem ipsum dolor sit adipisicing elit.</u> Quis voluptatum rem, quo corrupti vitae reiciendis vero tenetur blanditiis odio tempore!
            </i>
        </b>
    </p>

    <hr/> <!-- This is for horizontal line or ruler -->

    <!-- For Small Text size -->
    <br/>
    <small>
        This is Small text
    </small>

    <!-- For Big Text size -->
    <br/>
    <Big>
        This is a Big text
    </Big>

    <br/>

    <!-- Subscript and Supersricpt -->
    <!-- Subscript -->
    <p>H<sub>2</sub>O</p>
    <p>Log<sub>2</sub></p>

    <br/>
    <!-- Supersricpt -->
    <p>x<sup>2</sup></p>
    <p>y<sup>3</sup>+ x<sup>2</sup>- 5x</p>

</body>

</html>
